[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-platform-predictive-ml"
version = "0.1.0"
description = "A compact SQL, PyTorch, and cross-runtime inference prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<2.11", "numpy>=1.26,<3", "pandas>=2.2,<3",
  "duckdb>=1.2,<2", "scikit-learn>=1.5,<2",
  "onnx>=1.17,<2", "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
coreml = ["coremltools>=9,<10"]
litert = ["litert-torch>=0.8,<1; sys_platform == 'linux'", "ai-edge-litert>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["src*", "export*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
